<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e23" />
  <title>Snake Rush Arena</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { width:100%; height:100%; overflow:hidden; background:#070a1c; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; color:#eaf2ff; touch-action:none; user-select:none; -webkit-user-select:none; }
    #app { position:fixed; inset:0; }
    #game-host { position:absolute; inset:0; z-index:0; }
    #ui-root { position:absolute; inset:0; z-index:10; pointer-events:none; }
    #ui-root .panel, #ui-root button, #ui-root input { pointer-events:auto; }
    canvas { display:block; }

    /* ---------- shared look ---------- */
    .glass { background:rgba(10,14,35,.72); backdrop-filter:blur(12px); border:1px solid rgba(90,140,255,.22); box-shadow:0 8px 40px rgba(0,0,0,.5), inset 0 0 30px rgba(60,120,255,.05); border-radius:18px; }
    .neon-text { text-shadow:0 0 8px rgba(0,255,225,.65), 0 0 24px rgba(0,150,255,.4); }
    .btn { cursor:pointer; border:none; outline:none; color:#06121f; font-weight:800; letter-spacing:.5px; border-radius:14px; transition:transform .08s ease, filter .15s; background:linear-gradient(135deg,#00ffe1,#00b3ff); box-shadow:0 0 18px rgba(0,220,255,.45), 0 4px 0 rgba(0,80,120,.6); }
    .btn:hover { filter:brightness(1.12); transform:translateY(-1px); }
    .btn:active { transform:translateY(2px) scale(.98); box-shadow:0 0 10px rgba(0,220,255,.35), 0 1px 0 rgba(0,80,120,.6); }
    .btn.secondary { background:linear-gradient(135deg,#2a3f7d,#1c2a55); color:#cfe4ff; box-shadow:0 0 12px rgba(60,120,255,.25), 0 4px 0 rgba(10,20,50,.7); }
    .btn.gold { background:linear-gradient(135deg,#ffd44d,#ff9500); box-shadow:0 0 22px rgba(255,190,0,.5), 0 4px 0 rgba(140,80,0,.6); }
    .btn.danger { background:linear-gradient(135deg,#ff5a6e,#c81e4a); color:#fff; }
    .btn:disabled { filter:grayscale(.7) brightness(.6); cursor:not-allowed; }
    input.txt { background:rgba(6,10,26,.8); border:1px solid rgba(120,170,255,.35); color:#eaf2ff; border-radius:12px; padding:12px 16px; font-size:16px; outline:none; width:100%; }
    input.txt:focus { border-color:#00ffe1; box-shadow:0 0 12px rgba(0,255,225,.3); }

    /* ---------- screens ---------- */
    .screen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s; }
    .screen.on { opacity:1; pointer-events:auto; }
    .screen.dim { background:radial-gradient(ellipse at center, rgba(7,10,28,.4) 0%, rgba(4,6,18,.88) 100%); }

    /* menu */
    #menu .wrap { width:min(980px, 94vw); max-height:92vh; overflow-y:auto; padding:26px 30px; scrollbar-width:thin; }
    #logo { font-size:clamp(34px,6vw,58px); font-weight:900; text-align:center; line-height:1.05; background:linear-gradient(180deg,#aefff6,#00d5ff 45%,#7a5cff); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 18px rgba(0,220,255,.35)); }
    #logo small { display:block; font-size:.32em; letter-spacing:6px; color:#8fb4ff; -webkit-text-fill-color:#8fb4ff; margin-top:4px; }
    .row { display:flex; gap:14px; flex-wrap:wrap; align-items:stretch; }
    .col { flex:1; min-width:250px; }
    .sect-title { font-size:13px; font-weight:800; letter-spacing:2px; color:#7fa8ff; text-transform:uppercase; margin:16px 0 8px; }
    .mode-card { flex:1; min-width:150px; border-radius:14px; padding:12px 14px; cursor:pointer; border:1px solid rgba(90,140,255,.2); background:rgba(16,24,54,.7); transition:all .12s; }
    .mode-card:hover { border-color:#00ffe1; transform:translateY(-2px); }
    .mode-card.sel { border-color:#00ffe1; background:rgba(0,255,225,.1); box-shadow:0 0 16px rgba(0,255,225,.25); }
    .mode-card b { display:block; font-size:15px; }
    .mode-card span { font-size:11.5px; color:#8fa9d8; }
    .chip { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:rgba(20,30,66,.8); border:1px solid rgba(120,170,255,.25); font-size:13px; cursor:pointer; transition:all .1s; }
    .chip:hover { border-color:#00ffe1; }
    .chip.sel { background:rgba(0,255,225,.14); border-color:#00ffe1; box-shadow:0 0 10px rgba(0,255,225,.3); }
    .skin-cell { width:64px; height:64px; border-radius:12px; cursor:pointer; position:relative; border:2px solid rgba(120,170,255,.2); display:flex; align-items:center; justify-content:center; transition:transform .1s; }
    .skin-cell:hover { transform:scale(1.06); }
    .skin-cell.sel { border-color:#00ffe1; box-shadow:0 0 14px rgba(0,255,225,.45); }
    .skin-cell.locked { filter:saturate(.4) brightness(.55); }
    .skin-cell .price { position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); font-size:10px; background:#1a2650; border:1px solid rgba(255,212,77,.5); color:#ffd44d; padding:1px 7px; border-radius:99px; white-space:nowrap; }
    #play-area { display:flex; gap:16px; align-items:center; justify-content:center; margin-top:18px; flex-wrap:wrap; }
    #btn-play { font-size:clamp(20px,3vw,26px); padding:16px 74px; border-radius:18px; }
    .statbar { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; font-size:14px; color:#bcd2ff; margin-top:10px; }
    .statbar b { color:#fff; }
    .coin-pill { color:#ffd44d; font-weight:800; }

    /* leaderboard side */
    .lb-list { font-size:13px; }
    .lb-list li { list-style:none; display:flex; justify-content:space-between; padding:5px 8px; border-radius:8px; }
    .lb-list li:nth-child(odd){ background:rgba(30,45,95,.35); }
    .lb-list .rk { color:#7fa8ff; width:22px; }
    .lb-tabs { display:flex; gap:6px; margin-bottom:8px; }

    /* quests panel */
    .quest { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px dashed rgba(120,170,255,.15); font-size:13.5px; }
    .quest .bar { flex:1; height:7px; background:rgba(20,32,70,.9); border-radius:99px; overflow:hidden; }
    .quest .bar i { display:block; height:100%; background:linear-gradient(90deg,#00ffe1,#00b3ff); border-radius:99px; transition:width .4s; }
    .qrw { color:#ffd44d; font-weight:700; white-space:nowrap; }

    /* ---------- HUD ---------- */
    #hud { position:absolute; inset:0; display:none; pointer-events:none; }
    #hud.on { display:block; }
    .hud-tl { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:12px; padding:10px 16px; border-radius:14px; min-width:170px; }
    .hud-score { font-size:26px; font-weight:900; color:#fff; }
    .hud-sub { font-size:12px; color:#9dbcf5; }
    .hud-tr { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:12px; text-align:right; }
    .lb-mini { padding:8px 12px; border-radius:12px; font-size:12.5px; min-width:150px; }
    .lb-mini ol { margin-left:18px; padding:0; }
    .lb-mini li { padding:1px 0; color:#cfe0ff; }
    .lb-mini li.me { color:#00ffe1; font-weight:800; }
    #combo-wrap { position:absolute; top:16%; left:50%; transform:translateX(-50%); text-align:center; }
    #combo-num { font-size:44px; font-weight:900; color:#ffe97a; text-shadow:0 0 16px rgba(255,200,0,.7); opacity:0; transition:opacity .15s; }
    #combo-tier { font-size:16px; font-weight:800; letter-spacing:3px; color:#ff9ad5; opacity:0; }
    .pop { animation:pop .28s cubic-bezier(.2,1.6,.4,1); }
    @keyframes pop { 0%{transform:scale(1.7)} 100%{transform:scale(1)} }
    #announce { position:absolute; top:9%; left:50%; transform:translateX(-50%); font-size:17px; font-weight:800; color:#bfeaff; text-shadow:0 0 14px rgba(0,180,255,.7); background:rgba(10,18,44,.55); padding:8px 22px; border-radius:99px; border:1px solid rgba(90,160,255,.3); opacity:0; transition:opacity .3s; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis; }
    #killfeed { position:absolute; top:calc(120px + env(safe-area-inset-top)); right:12px; font-size:12px; color:#ffd0d8; text-align:right; }
    #killfeed div { background:rgba(20,10,25,.55); padding:3px 10px; border-radius:8px; margin:3px 0; animation:fadein .2s; }
    @keyframes fadein { from{opacity:0; transform:translateX(20px)} }
    #minimap { position:absolute; right:calc(12px + env(safe-area-inset-right)); bottom:calc(12px + env(safe-area-inset-bottom)); border-radius:14px; border:1px solid rgba(90,140,255,.3); background:rgba(8,12,30,.75); }
    #skill-bar { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; gap:10px; pointer-events:auto; }
    .skill-btn { position:relative; width:64px; height:64px; border-radius:50%; border:2px solid rgba(140,190,255,.4); background:rgba(14,22,50,.85); color:#fff; font-size:26px; cursor:pointer; overflow:hidden; transition:transform .08s; }
    .skill-btn:active { transform:scale(.92); }
    .skill-btn .cd { position:absolute; inset:0; background:conic-gradient(rgba(4,8,20,.82) var(--p,0%), transparent 0); pointer-events:none; }
    .skill-btn.ready { border-color:#00ffe1; box-shadow:0 0 14px rgba(0,255,225,.5); }
    #boost-btn { position:absolute; right:calc(22px + env(safe-area-inset-right)); bottom:calc(110px + env(safe-area-inset-bottom)); width:84px; height:84px; border-radius:50%; font-size:13px; font-weight:900; display:none; pointer-events:auto; }
    body.touch #boost-btn { display:block; }
    #fuel-wrap { position:absolute; left:12px; bottom:calc(14px + env(safe-area-inset-bottom)); width:150px; }
    #fuel-bar { height:8px; background:rgba(20,32,70,.9); border-radius:99px; overflow:hidden; margin-top:4px; }
    #fuel-bar i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#00ffe1,#7a5cff); }
    #time-left { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); font-size:15px; font-weight:800; color:#cfe4ff; background:rgba(12,18,44,.6); padding:5px 16px; border-radius:99px; border:1px solid rgba(90,140,255,.25); }
    #btn-pause { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:50%; margin-left:110px; width:38px; height:38px; border-radius:10px; font-size:16px; pointer-events:auto; }
    #death-overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:rgba(6,8,22,.55); pointer-events:auto; }
    #death-overlay.on { display:flex; }
    #respawn-count { font-size:44px; font-weight:900; color:#ff8fa3; text-shadow:0 0 20px rgba(255,80,120,.6); }

    /* game over */
    #gameover .box { width:min(560px,92vw); padding:30px; text-align:center; }
    .go-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0; }
    .go-stat { background:rgba(20,32,70,.6); border-radius:12px; padding:10px 6px; }
    .go-stat b { display:block; font-size:22px; color:#fff; }
    .go-stat span { font-size:11px; color:#8fa9d8; letter-spacing:1px; text-transform:uppercase; }
    .reward-line { font-size:15px; margin:6px 0; color:#cfe4ff; }
    .reward-line b { color:#ffd44d; }

    /* shop modal */
    #shop .box { width:min(720px,94vw); max-height:86vh; overflow-y:auto; padding:24px; }
    .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%); background:rgba(10,20,48,.95); border:1px solid #00ffe1; color:#dffcff; padding:10px 22px; border-radius:99px; font-size:14px; font-weight:700; z-index:99; box-shadow:0 0 20px rgba(0,255,225,.3); animation:fadein .2s; pointer-events:none; }

    #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#070a1c; z-index:50; transition:opacity .4s; font-weight:800; letter-spacing:4px; color:#5f86c9; }
    @media (max-width:640px){
      .hud-tr .lb-mini{display:none}
      #menu .wrap{padding:16px}
      .skill-btn{width:56px;height:56px;font-size:22px}
    }
  </style>
</head>
<body>
<div id="app">
  <div id="game-host"></div>
  <div id="ui-root"></div>
  <div id="loading">SNAKE RUSH ARENA…</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
